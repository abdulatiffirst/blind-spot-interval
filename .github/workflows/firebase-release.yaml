name: Firebase release
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Full main commit SHA approved in staging
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: firebase-production-release
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.sha == inputs.expected_commit
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_BACKEND: firebase
      VITE_USE_FIREBASE_EMULATORS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check selected release and web configuration
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -n "$FIREBASE_PROJECT_ID"
          test -n "$VITE_FIREBASE_API_KEY"
          test -n "$VITE_FIREBASE_AUTH_DOMAIN"
          test -n "$VITE_FIREBASE_APP_ID"
          case "$FIREBASE_PROJECT_ID" in demo-*) exit 1 ;; esac
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
      - name: Deploy reviewed Firebase release
        run: |
          npx --no-install firebase deploy --non-interactive \
            --project "$FIREBASE_PROJECT_ID" \
            --only "functions:api,functions:syncJob,functions:reconcileCalendar,hosting"
      - name: Record deployed build
        run: |
          curl --fail --silent --show-error --retry 4 \
            "https://$FIREBASE_PROJECT_ID.web.app/build-info.json" |
            node -e '
              let data = "";
              process.stdin.on("data", chunk => { data += chunk });
              process.stdin.on("end", () => {
                const build = JSON.parse(data);
                if (build.commit !== process.env.GITHUB_SHA) process.exitCode = 1;
                else console.log(build.commit);
              });
            '
