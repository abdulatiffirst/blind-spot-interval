name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          {
            POSTGRES_USER: blindspot,
            POSTGRES_PASSWORD: blindspot,
            POSTGRES_DB: blindspot,
          }
        ports: [5432:5432]
        options: --health-cmd="pg_isready -U blindspot" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      DATABASE_URL: postgres://blindspot:blindspot@localhost:5432/blindspot
      PLAYWRIGHT_BROWSERS_PATH: /tmp/blindspot-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run build
      - run: npm run test:legacy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:legacy
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: browser-results, path: test-results/ }
