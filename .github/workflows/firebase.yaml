name: Firebase validation
on: [push, pull_request]
jobs:
  firebase:
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/blindspot-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run test:firebase
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CONNECT_UX_SCREENSHOTS: "true"
          REVIEW_QA_SCREENSHOTS: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: review-screenshots
          path: test-results/app-*/review-*.png
      - uses: actions/upload-artifact@v4
        with:
          name: connect-disabled-screenshots
          path: test-results/connect-*/settings-disabled-*.png
      - run: npm run test:connect
        env:
          CONNECT_UX_SCREENSHOTS: "true"
      - uses: actions/upload-artifact@v4
        with:
          name: connect-enabled-screenshots
          path: test-results/connect-*/*.png
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: firebase-test-results, path: test-results/ }
